# omp settings overlay, loaded via PI_CONFIG_FILES (zsh/env/omp.zsh). Wins over
# ~/.omp/agent/config.yml, which omp rewrites itself and stays untracked.
modelRoles:
  default: ollama/local-agent:latest
images:
  # local-agent has no vision. Without this, omp routes each image to the
  # first vision model it finds and swaps 20 GB models on the shared server.
  describeForTextModels: false
