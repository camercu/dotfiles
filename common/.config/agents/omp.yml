# omp settings overlay, loaded via PI_CONFIG_FILES (zsh/env/omp.sh). Wins over
# ~/.config/omp/agent/config.yml, which omp rewrites itself and stays untracked.
modelRoles:
  default: ollama/local-agent:latest
images:
  # local-agent has no vision. Otherwise omp sends images (attachments and
  # `read <img>?q=`) to the first vision model it finds, swapping 20 GB models
  # on the shared server. Blocked images fail loud with a settings message.
  blockImages: true
